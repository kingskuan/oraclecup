<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="orb" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00FFB3"/>
      <stop offset="55%" stop-color="#00D395"/>
      <stop offset="100%" stop-color="#006B4D"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="400" height="400" fill="#0A0E1A"/>

  <!-- Outer ring (Cup) -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.9"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#FF6B00" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Oracle orb -->
  <circle cx="200" cy="200" r="100" fill="url(#orb)" filter="url(#glow)"/>

  <!-- Soccer ball pentagon pattern (subtle) -->
  <g opacity="0.25" stroke="#0A0E1A" stroke-width="2" fill="none">
    <polygon points="200,140 230,165 220,205 180,205 170,165"/>
    <line x1="200" y1="140" x2="200" y2="120"/>
    <line x1="230" y1="165" x2="248" y2="155"/>
    <line x1="220" y1="205" x2="240" y2="225"/>
    <line x1="180" y1="205" x2="160" y2="225"/>
    <line x1="170" y1="165" x2="152" y2="155"/>
  </g>

  <!-- AI core dot -->
  <circle cx="200" cy="200" r="10" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="200" cy="200" r="20" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>

  <!-- "OC" monogram -->
  <text x="200" y="365" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" letter-spacing="6">ORACLECUP</text>
</svg>
